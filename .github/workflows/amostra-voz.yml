name: amostra-voz
on:
  workflow_dispatch:
    inputs:
      roteiro: { description: "roteiro.json no repositório", default: "data/exemplos_aprovados/patch60-azir-84.json" }
      vozes: { description: "tags de design do OmniVoice, separadas por ;", default: "female, young adult, moderate pitch;female, young adult, low pitch" }
jobs:
  amostra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h / | tail -1
      - uses: actions/cache@v4
        with: { path: ~/vsdata, key: voicestudio-0.5.6-omnivoice }
      - name: subir VoiceStudio
        run: |
          mkdir -p ~/vsdata
          docker run -d --name vs -p 127.0.0.1:3900:3900 -e OMNIVOICE_ANALYTICS_DISABLED=1 \
            -e OMNIVOICE_DATA_DIR=/app/omnivoice_data -v ~/vsdata:/app/omnivoice_data ghcr.io/debpalash/voicestudio:0.5.6
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3900/health >/dev/null && break; sleep 5; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q requests jsonschema
      - name: narrar com cada voz
        env: { LOL_VOICESTUDIO_URL: "http://127.0.0.1:3900" }
        run: |
          IFS=';' read -ra V <<< "${{ inputs.vozes }}"
          i=1; for v in "${V[@]}"; do
            LOL_VS_VOZ="$v" python tools/amostra_voz.py "${{ inputs.roteiro }}" "amostras/voz$i" voicestudio || true
            echo "$v" > "amostras/voz$i/descricao.txt"; i=$((i+1))
          done
      - uses: actions/upload-artifact@v4
        with: { name: amostras-voz, path: amostras/, include-hidden-files: true }
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/vsdata || true
