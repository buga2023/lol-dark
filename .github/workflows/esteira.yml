name: esteira
on:
  schedule: [{ cron: "0 12,16,22 * * *" }]   # 09h, 13h e 19h em Salvador
  workflow_dispatch:
    inputs:
      modo: { description: "auto ou aprovacao", default: auto }
      dry_run: { description: "não publica nem manda Telegram", type: boolean, default: false }
      roteiro: { description: "caminho de um roteiro.json pronto (pula a escrita)", default: "" }
permissions: { contents: write }
concurrency: { group: state, cancel-in-progress: false }
jobs:
  esteira:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      LOL_MODO: ${{ inputs.modo || vars.LOL_MODO || 'auto' }}
      LOL_YT_PRIVACIDADE: ${{ vars.LOL_YT_PRIVACIDADE || 'private' }}
      VOICEMAKER_API_KEY: ${{ secrets.VOICEMAKER_API_KEY }}
      LOL_VM_VOZ: ${{ vars.LOL_VM_VOZ }}
      LOL_WORKERS: "2"
      LOL_VOZ_PROVEDOR: ${{ vars.LOL_VOZ_PROVEDOR }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: liberar disco para o VoiceStudio
        if: vars.LOL_VOICESTUDIO == '1'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - name: cache dos modelos do VoiceStudio
        if: vars.LOL_VOICESTUDIO == '1'
        uses: actions/cache@v4
        with: { path: ~/vsdata, key: voicestudio-0.5.6-omnivoice }
      - name: subir VoiceStudio (voz local, sem chave)
        if: vars.LOL_VOICESTUDIO == '1'
        run: |
          mkdir -p ~/vsdata
          docker run -d --name vs -p 127.0.0.1:3900:3900 -e OMNIVOICE_ANALYTICS_DISABLED=1 \
            -e OMNIVOICE_DATA_DIR=/app/omnivoice_data -v ~/vsdata:/app/omnivoice_data ghcr.io/debpalash/voicestudio:0.5.6
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3900/health >/dev/null && break; sleep 5; done
          curl -fsS http://127.0.0.1:3900/health >/dev/null && echo "LOL_VOICESTUDIO_URL=http://127.0.0.1:3900" >> "$GITHUB_ENV"
      - uses: ./.github/actions/preparar
        with: { render: "true" }
      - run: python tools/coletar.py
      - run: python tools/run_pipeline.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.roteiro && format('--roteiro {0}', inputs.roteiro) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ github.run_id }}
          path: |
            .tmp/*/*.mp4
            .tmp/*/roteiro.json
            .tmp/*/rodadas.json
            .tmp/*/laudo.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: ./.github/actions/salvar-estado
        if: always()
      - name: keepalive (o GitHub pausa cron de repo público sem commit no branch padrão por 60 dias)
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct origin/${{ github.event.repository.default_branch }})
          if [ $(( $(date +%s) - ultimo )) -gt $((45*86400)) ]; then
            git config user.name "lol-dark-bot"; git config user.email "lol-dark-bot@users.noreply.github.com"
            git commit -q --allow-empty -m "keepalive do cron" && git push -q
          fi
