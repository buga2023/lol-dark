name: esteira
on:
  schedule: [{ cron: "0 12 * * *" }]   # 09:00 em Salvador
  workflow_dispatch:
    inputs:
      modo: { description: "auto ou aprovacao", default: auto }
      dry_run: { description: "não publica nem manda Telegram", type: boolean, default: false }
permissions: { contents: write }
concurrency: { group: state, cancel-in-progress: false }
jobs:
  esteira:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      LOL_MODO: ${{ inputs.modo || vars.LOL_MODO || 'auto' }}
      LOL_YT_PRIVACIDADE: ${{ vars.LOL_YT_PRIVACIDADE || 'private' }}
      LOL_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/preparar
        with: { render: "true" }
      - run: python tools/coletar.py
      - run: python tools/run_pipeline.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ github.run_id }}
          path: |
            .tmp/*/*.mp4
            .tmp/*/roteiro.json
            .tmp/*/rodadas.json
            .tmp/*/laudo.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: ./.github/actions/salvar-estado
        if: always()
      - name: keepalive (o GitHub pausa cron de repo público sem commit no branch padrão por 60 dias)
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct origin/${{ github.event.repository.default_branch }})
          if [ $(( $(date +%s) - ultimo )) -gt $((45*86400)) ]; then
            git config user.name "lol-dark-bot"; git config user.email "lol-dark-bot@users.noreply.github.com"
            git commit -q --allow-empty -m "keepalive do cron" && git push -q
          fi
