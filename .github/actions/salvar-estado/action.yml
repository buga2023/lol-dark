name: salvar-estado
description: commita ./state no branch state, com rebase e nova tentativa se outro job empurrou antes
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cd state
        git config user.name "lol-dark-bot"; git config user.email "lol-dark-bot@users.noreply.github.com"
        git add -A
        git diff --cached --quiet && { echo "estado sem mudança"; exit 0; }
        git commit -qm "estado: ${GITHUB_WORKFLOW} $(date -u +%FT%TZ)"
        for i in 1 2 3 4; do
          git push -q origin HEAD:state && exit 0
          sleep $((i*5)); git pull -q --rebase origin state || true
        done
        echo "não consegui gravar o estado"; exit 1
